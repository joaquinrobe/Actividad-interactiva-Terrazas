<style>
/* Layout: cabecera con datos del alumno, pestañas por parte de la unidad; columna de trabajo + soneto fijo al lado (arriba y plegable en el teléfono). */
:root {
  --paper: #F3F4F1;
  --surface: #FFFFFF;
  --ink: #1E2230;
  --muted: #5B6070;
  --line: #D8DAD4;
  --grana: #A3203A;      /* grana cochinilla */
  --grana-soft: #F6E4E7;
  --ok: #2B7A4B;
  --ok-soft: #E2F1E7;
  --bad: #AF4229;
  --bad-soft: #F8E5DF;
  --syl-a: #F6E4E7;
  --syl-b: #E3E8F1;
  --f-display: "IM Fell English", "Iowan Old Style", Georgia, serif;
  --f-read: "Literata", "Iowan Old Style", Georgia, serif;
  --f-ui: "Public Sans", system-ui, -apple-system, "Segoe UI", sans-serif;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --paper: #14161D; --surface: #1C1F28; --ink: #E8E7E2; --muted: #A2A6B2; --line: #2F3341;
    --grana: #E46A80; --grana-soft: #3A1F27; --ok: #6CC290; --ok-soft: #1C3327; --bad: #E78C73; --bad-soft: #3B251F; --syl-a: #3A1F27; --syl-b: #22293A;
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --paper: #14161D; --surface: #1C1F28; --ink: #E8E7E2; --muted: #A2A6B2; --line: #2F3341;
  --grana: #E46A80; --grana-soft: #3A1F27; --ok: #6CC290; --ok-soft: #1C3327; --bad: #E78C73; --bad-soft: #3B251F; --syl-a: #3A1F27; --syl-b: #22293A;
  color-scheme: dark;
}
* { box-sizing: border-box; }
body { background: var(--paper); color: var(--ink); font-family: var(--f-ui); font-size: 17px; line-height: 1.55; }
.wrap { max-width: 1180px; margin: 0 auto; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); }

header.top { border-bottom: 1px solid var(--line); background: var(--surface); }
header.top .wrap { padding-block: 22px 18px; display: flex; flex-wrap: wrap; gap: 16px 32px; align-items: flex-end; justify-content: space-between; }
.eyebrow { font-size: 14px; letter-spacing: .08em; text-transform: uppercase; color: var(--grana); font-weight: 600; margin: 0 0 4px; }
h1 { font-family: var(--f-display); font-weight: 400; font-size: clamp(30px, 4.5vw, 42px); line-height: 1.1; margin: 0; text-wrap: balance; }

.byline { color: var(--muted); margin: 6px 0 0; }
.course { color: var(--muted); font-size: 15px; margin: 2px 0 0; }
.student { display: flex; flex-wrap: wrap; gap: 10px; }
.student label { display: flex; flex-direction: column; font-size: 14px; color: var(--muted); font-weight: 500; gap: 3px; }
.student input { font: inherit; font-size: 17px; color: var(--ink); background: var(--paper); border: 1px solid var(--line); border-radius: 6px; padding: 7px 10px; width: 240px; max-width: 100%; }
.student label.small input { width: 110px; }

nav.tabs { position: sticky; top: env(safe-area-inset-top, 0px); z-index: 5; background: var(--paper); border-bottom: 1px solid var(--line); }
body::before { content: ""; position: fixed; inset: 0 0 auto; height: env(safe-area-inset-top, 0px); z-index: 10; background: var(--paper); }
nav.tabs .wrap { display: flex; gap: 4px; overflow-x: auto; scrollbar-width: none; }
.tab { font: inherit; font-weight: 500; color: var(--muted); background: none; border: 0; border-bottom: 2px solid transparent; padding: 12px 12px 10px; cursor: pointer; white-space: nowrap; display: flex; gap: 8px; align-items: center; }
.tab:hover { color: var(--ink); }
.tab[aria-current="true"] { color: var(--ink); border-bottom-color: var(--grana); }
.locked-q { opacity: .6; }
.locked-q .locked-msg { margin: 0; color: var(--muted); font-size: 15px; }
.tab.locked { opacity: .45; cursor: not-allowed; }
.next-row { display: flex; flex-wrap: wrap; gap: 10px 14px; align-items: center; }
.next-row .next-msg { color: var(--muted); font-size: 15px; }
button.btn:disabled { opacity: .5; cursor: not-allowed; }
.tab .count { font-size: 13px; font-variant-numeric: tabular-nums; background: var(--surface); border: 1px solid var(--line); border-radius: 99px; padding: 0 7px; color: var(--muted); }
.tab .count.full { background: var(--ok-soft); border-color: transparent; color: var(--ok); }

main .wrap { display: grid; grid-template-columns: minmax(0, 1fr) 450px; gap: 32px; padding-block: 28px 64px; align-items: start; }
@media (max-width: 900px) { main .wrap { grid-template-columns: minmax(0, 1fr); } aside.poem-side { order: -1; } }

@media (max-width: 900px) { aside.poem-side { position: static; } }
.poem-card { background: var(--surface); border: 1px solid var(--line); border-radius: 8px; }
.poem-card summary { cursor: pointer; padding: 12px 16px; font-weight: 600; font-size: 15px; letter-spacing: .04em; text-transform: uppercase; color: var(--muted); list-style: none; display: flex; justify-content: space-between; }
.poem-card summary::-webkit-details-marker { display: none; }
.poem-card summary::after { content: "Mostrar"; text-transform: none; letter-spacing: 0; font-weight: 500; color: var(--grana); }
.poem-card[open] summary::after { content: "Ocultar"; }

@media (min-width: 901px) { .poem-body { max-height: calc(100vh - 150px); overflow-y: auto; } }
.poem-title { font-family: var(--f-display); font-size: 25px; text-align: center; margin: 4px 0 12px; }
.poem { font-family: var(--f-read); font-size: clamp(14px, 4vw, 17px); line-height: 1.6; margin: 0; overflow-x: auto; }
.vl span:last-child { white-space: nowrap; }
.stanza { margin: 0 0 12px; }
.vl { display: grid; grid-template-columns: 22px 1fr; gap: 6px; }
.vn { font-family: var(--f-ui); font-size: 12px; color: var(--muted); text-align: right; padding-top: 5px; font-variant-numeric: tabular-nums; }

.notas-t { margin: 0 0 6px; font-weight: 600; font-size: 13px; letter-spacing: .06em; text-transform: uppercase; color: var(--muted); }

.notas dd { margin: 0; color: var(--muted); }

.ref .sc { font-variant: small-caps; letter-spacing: .03em; }

section.part { min-width: 0; display: flex; flex-direction: column; gap: 22px; }
.part-head h2 { font-family: var(--f-display); font-weight: 400; font-size: 34px; margin: 0; line-height: 1.15; }
.part-head .lead { font-family: var(--f-read); color: var(--muted); margin: 8px 0 0; max-width: 64ch; }
.reading { font-family: var(--f-read); font-size: 18px; line-height: 1.7; max-width: 66ch; }
.reading h3 { font-family: var(--f-ui); font-size: 15px; letter-spacing: .07em; text-transform: uppercase; color: var(--grana); margin: 22px 0 6px; }
.reading p { margin: 0 0 12px; }
.reading ul { margin: 0 0 12px; padding-left: 20px; }
.reading li { margin-bottom: 6px; }
.reading figure.obra { margin: 20px 0 8px; max-width: 420px; }
.reading figure.obra img { display: block; width: 100%; height: auto; border-radius: 4px; border: 1px solid var(--line); }
.reading figure.obra figcaption { font-family: var(--f-ui); font-size: 14px; line-height: 1.45; color: var(--muted); margin-top: 8px; }
.reading blockquote { margin: 8px 0 14px; padding-left: 14px; border-left: 2px solid var(--grana); font-style: italic; }

.q { background: var(--surface); border: 1px solid var(--line); border-radius: 8px; padding: 18px 20px; display: flex; flex-direction: column; gap: 12px; }
.q.done { border-color: color-mix(in srgb, var(--ok) 35%, var(--line)); }
.q-head { display: flex; gap: 12px; align-items: baseline; }
.q-num { font-family: var(--f-display); font-size: 23px; color: var(--grana); min-width: 22px; }
.q-head p { margin: 0; font-family: var(--f-read); font-size: 18px; }
.q-head .tag { margin-left: auto; font-size: 13px; color: var(--muted); white-space: nowrap; }
.verse-quote { font-family: var(--f-read); font-style: italic; background: var(--paper); border-radius: 6px; padding: 10px 14px; margin: 0; }
.opts { display: flex; flex-direction: column; gap: 6px; }
.opt { display: flex; gap: 10px; align-items: flex-start; padding: 8px 12px; border: 1px solid var(--line); border-radius: 6px; cursor: pointer; }
.opt:hover { border-color: var(--muted); }
.opt input { margin-top: 4px; accent-color: var(--grana); }
.opt.right { background: var(--ok-soft); border-color: transparent; }
.opt.wrong { background: var(--bad-soft); border-color: transparent; }
.opt.locked { cursor: default; }

textarea, input.num, select { font: inherit; color: var(--ink); background: var(--paper); border: 1px solid var(--line); border-radius: 6px; padding: 8px 10px; }
textarea { width: 100%; min-height: 96px; resize: vertical; font-family: var(--f-read); font-size: 17px; line-height: 1.55; }
textarea[readonly] { background: transparent; border-style: dashed; }
input.txt { font: inherit; font-family: var(--f-read); font-size: 17px; color: var(--ink); background: var(--paper); border: 1px solid var(--line); border-radius: 6px; padding: 8px 10px; width: 100%; max-width: 360px; }
input.txt[readonly] { background: transparent; border-style: dashed; }
input.num { width: 80px; font-variant-numeric: tabular-nums; }
:focus-visible { outline: 2px solid var(--grana); outline-offset: 2px; }

.row { display: flex; flex-wrap: wrap; gap: 10px; align-items: center; }
button.btn { font: inherit; font-weight: 600; font-size: 16px; border: 1px solid var(--ink); background: var(--ink); color: var(--paper); border-radius: 6px; padding: 8px 16px; cursor: pointer; }
button.btn:hover { opacity: .88; }
button.btn.ghost { background: transparent; color: var(--ink); border-color: var(--line); }
button.btn.danger { background: var(--bad); border-color: var(--bad); color: #fff; }

.fb { border-radius: 6px; padding: 10px 14px; font-size: 16px; }
.fb p { margin: 0 0 6px; } .fb p:last-child { margin: 0; }
.fb.ok { background: var(--ok-soft); }
.fb.bad { background: var(--bad-soft); }
.fb.info { background: var(--paper); border: 1px solid var(--line); }
.fb strong { font-weight: 600; }
.fb .label { font-size: 13px; letter-spacing: .07em; text-transform: uppercase; font-weight: 700; color: var(--grana); display: block; margin-bottom: 4px; }
.fb .model { font-family: var(--f-read); }
.syl { font-family: var(--f-read); letter-spacing: .02em; }

.rhyme { display: grid; grid-template-columns: 24px minmax(0, 1fr) 64px 20px; gap: 6px 10px; align-items: center; font-family: var(--f-read); }
.rhyme .vn { padding: 0; }
.rhyme .gap { grid-column: 1 / -1; height: 6px; }
.rhyme mark { background: var(--grana-soft); color: inherit; border-radius: 3px; padding: 0 2px; }
.rhyme select { padding: 4px 6px; }
.rhyme .mk { font-size: 15px; font-family: var(--f-ui); }
.mk.y { color: var(--ok); } .mk.n { color: var(--bad); }

.pick { font-family: var(--f-read); font-size: 18px; line-height: 2; background: var(--paper); border-radius: 6px; padding: 12px 14px; }
.pick .stanza { margin-bottom: 10px; }
.tok { font: inherit; background: none; border: 0; padding: 0 2px; margin: 0 -2px; position: relative; border-radius: 3px; color: var(--ink); cursor: pointer; }
.tok:hover { background: var(--grana-soft); }
.tok-dado { padding: 0 2px; margin: 0 -2px; border-radius: 3px; background: var(--syl-b); font-weight: 600; cursor: default; }
.vn-inline { display: inline-block; width: 26px; font-family: var(--f-ui); font-size: 12px; color: var(--muted); font-variant-numeric: tabular-nums; }
.tok-nota { padding: 0 2px; margin: 0 -2px; border-radius: 3px; background: var(--paper); text-decoration: underline dotted var(--muted); text-underline-offset: 4px; color: var(--muted); cursor: help; }
.pick .tok-nota { background: var(--line); }
.leyenda { margin: 0; font-size: 15px; color: var(--muted); }
.leyenda .tok-nota { background: var(--line); }
.tok.on { background: var(--grana); color: #fff; }
.tok:disabled { cursor: default; }
.notes { display: flex; flex-direction: column; gap: 10px; }
.note label { font-weight: 600; font-size: 16px; display: block; margin-bottom: 4px; }
.note label span { color: var(--muted); font-weight: 400; }
.note textarea { min-height: 60px; }

.opt .def { font-family: var(--f-read); }
.dict { display: flex; flex-direction: column; gap: 14px; }
.dict-item { border-top: 1px solid var(--line); padding-top: 12px; display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 1fr); gap: 8px 14px; }
.dict-item h4 { grid-column: 1 / -1; margin: 0; font-family: var(--f-read); font-size: 18px; font-weight: 600; }
.dict-item h4 span { font-family: var(--f-ui); font-weight: 400; font-size: 15px; color: var(--muted); }
.dict-item label { font-size: 14px; color: var(--muted); font-weight: 500; display: flex; flex-direction: column; gap: 3px; }
.dict-item textarea { min-height: 70px; }
@media (max-width: 560px) { .dict-item { grid-template-columns: minmax(0, 1fr); } }
a { color: var(--grana); }
.aviso { background: var(--surface); border: 1px solid var(--grana); border-radius: 8px; padding: 14px 18px; font-family: var(--f-read); font-size: 17px; max-width: 66ch; }
.poema-nota { font-size: 14px; color: var(--muted); margin: 0 0 8px; font-style: italic; }
.video-link .doc { width: 36px; height: 44px; border-radius: 3px; background: var(--grana); position: relative; flex: none; }
.video-link .doc::after { content: ""; position: absolute; left: 8px; right: 8px; top: 12px; height: 2px; background: #fff; box-shadow: 0 7px 0 #fff, 0 14px 0 #fff; }
.extra { background: var(--grana-soft); border-radius: 10px; padding: 20px 22px; display: flex; flex-direction: column; gap: 10px; }
.extra .extra-eyebrow { margin: 0; font-size: 13px; font-weight: 700; letter-spacing: .08em; text-transform: uppercase; color: var(--grana); }
.extra h3 { margin: 0; font-family: var(--f-display); font-weight: 400; font-size: 26px; line-height: 1.15; }
.extra p { margin: 0; font-family: var(--f-read); font-size: 17px; max-width: 62ch; }
.extra .video { position: relative; width: 100%; max-width: 640px; aspect-ratio: 16 / 9; border-radius: 6px; overflow: hidden; background: #000; }
.extra .video iframe { position: absolute; inset: 0; width: 100%; height: 100%; border: 0; }
.video-link { display: flex; gap: 14px; align-items: center; align-self: flex-start; background: var(--surface); border: 1px solid var(--line); border-radius: 8px; padding: 12px 18px 12px 12px; color: var(--ink); text-decoration: none; }
.video-link:hover { border-color: var(--grana); }
.video-link .play { width: 44px; height: 44px; border-radius: 50%; background: var(--grana); position: relative; flex: none; }
.video-link .play::after { content: ""; position: absolute; left: 17px; top: 13px; border-left: 14px solid #fff; border-top: 9px solid transparent; border-bottom: 9px solid transparent; }
.ideas ul { margin: 0; padding: 0; list-style: none; display: flex; flex-direction: column; gap: 6px; }
.ideas li { padding-left: 22px; position: relative; }
.ideas li::before { position: absolute; left: 0; font-weight: 700; }
.ideas li.si::before { content: "✓"; color: var(--ok); }
.ideas li.no::before { content: "→"; color: var(--grana); }

.syl-line { font-family: var(--f-read); font-size: 28px; line-height: 1.5; background: var(--paper); border-radius: 6px; padding: 26px 14px 12px; display: flex; flex-wrap: wrap; row-gap: 22px; }
.syl-line .w { white-space: nowrap; display: inline-flex; }
.syl-line .sp { white-space: pre; }
.ch { font: inherit; color: var(--ink); background: none; border: 0; margin: 0; padding: 0 1px; cursor: pointer; position: relative; border-radius: 0; }
.ch:not(:disabled):hover { outline: 1px solid var(--grana); outline-offset: -1px; }
.ch:disabled { cursor: default; }
.ch.a, .sp.a { background: var(--syl-a); }
.ch.b, .sp.b { background: var(--syl-b); }
.ch.start { box-shadow: inset 2px 0 0 var(--grana); }
.ch.start::before { content: attr(data-n); position: absolute; top: -1.35em; left: 1px; font: 600 13px/1 var(--f-ui); color: var(--grana); }
.pu { color: var(--muted); }
.syl-count { margin: 0; font-size: 16px; color: var(--muted); }
.syl-count strong { color: var(--ink); font-variant-numeric: tabular-nums; }
.acc-row { display: flex; flex-wrap: wrap; gap: 6px; }
.acc { font: inherit; font-family: var(--f-read); font-size: 21px; color: var(--ink); background: var(--surface); border: 1px solid var(--line); border-radius: 6px; padding: 6px 10px 4px; min-width: 44px; display: flex; flex-direction: column; align-items: center; cursor: pointer; }
.acc small { font: 500 13px var(--f-ui); color: var(--muted); font-variant-numeric: tabular-nums; }
.acc.on { background: var(--grana); border-color: var(--grana); color: #fff; }
.acc.on small { color: #fff; }
.acc:disabled { cursor: default; }

.next { align-self: flex-start; }
.summary { width: 100%; border-collapse: collapse; font-variant-numeric: tabular-nums; }
.summary td, .summary th { text-align: left; padding: 8px 10px; border-bottom: 1px solid var(--line); }
.summary th { font-size: 14px; text-transform: uppercase; letter-spacing: .06em; color: var(--muted); font-weight: 600; }
.pill { font-size: 14px; border-radius: 99px; padding: 2px 9px; font-weight: 600; }
.pill.ok { background: var(--ok-soft); color: var(--ok); }
.pill.pend { background: var(--grana-soft); color: var(--grana); }
.send { border: 1px solid var(--line); background: var(--surface); border-radius: 8px; padding: 16px 20px; display: flex; flex-direction: column; gap: 10px; }
.send h3, .steps-title { margin: 0; font-size: 18px; }
.send p { margin: 0; }
.steps { margin: 0; padding-left: 20px; font-family: var(--f-read); }
.steps li { margin-bottom: 6px; }
textarea.report { min-height: 260px; font-family: ui-monospace, "SF Mono", Menlo, monospace; font-size: 14px; }
.confirm { display: flex; flex-wrap: wrap; gap: 10px; align-items: center; }
@media (prefers-reduced-motion: no-preference) { .q { transition: border-color .2s; } }
</style>
</head>

<header class="top">
  <div class="wrap">
    <div>
      <p class="eyebrow" id="eyebrow"></p>
      <h1 id="title"></h1>
      <p class="byline" id="byline"></p>
      <p class="course" id="course"></p>

    <div class="student">
      <label for="nombre">Nombre completo<input id="nombre" autocomplete="name" placeholder="Escribe tu nombre"></label>
      <label for="correo">Correo<input id="correo" type="email" autocomplete="email" inputmode="email" placeholder="tu@correo.com"></label>
    </div>
  </div>
</header>
<nav class="tabs" aria-label="Partes de la unidad"><div class="wrap" id="tabs"></div></nav>
<main>
  <div class="wrap">
    <section class="part" id="part"></section>
    <aside class="poem-side">
      <details class="poem-card" id="poemCard">
        <summary>El poema</summary>
        <div class="poem-body" id="poemBody"></div>
      </details>
    </aside>
  </div>
</main>

<script>
/* ================================================================
   UNIDAD DIDÁCTICA: María Estrada de Medinilla, décimas a la oliva de Nolasco.
   Versión breve. Los términos que ya explica la edición van en «notas»
   y no se preguntan en Vocabulario.
   ================================================================ */
const UNIDAD = {
  id: "estrada-medinilla-oliva",
  pagina: "Actividad interactiva - Estrada de Medinilla",
  vistaPrevia: "Literatura novohispana · Bloque III: Lírica · María Estrada de Medinilla, «Nolasco con paz fingida»",
  programa: "Licenciatura en Letras Hispánicas",
  curso: "Literatura novohispana",
  bloque: "Bloque III: Lírica",
  profesor: "Dr. Joaquín Rodríguez Beltrán",
  autor: "María Estrada de Medinilla",
  titulo: "Nolasco con paz fingida",
  rotulo: "",
  poemaNota: "Versos 1-30. En esta actividad analizamos solo las tres primeras estrofas; el poema completo tiene seis.",
  avisoInicial: "<strong>En esta actividad analizaremos solo las tres primeras estrofas del poema</strong> (versos 1-30). El poema completo tiene seis; las otras tres puedes leerlas en la edición de Tenorio.",
  avisoFinal: {

      lead: "Conoce a la autora y la ocasión del poema: un concurso poético sobre un tema fijo, el sueño de san Pedro Nolasco. Lee el contexto antes de empezar.",
      lectura: `
        <h3>La autora</h3>
        <p>María Estrada de Medinilla es la poeta novohispana más importante antes de sor Juana y, a diferencia de ella, <strong>no era monja</strong>: era una mujer seglar, con título de doña. De su vida sabemos muy poco, salvo que era natural de México. Publicó en su tiempo dos poemas extensos dedicados al virrey Marqués de Villena: una <i>Relación en ovillejos</i> sobre su entrada en la ciudad (1640) y una <i>Descripción en octavas reales</i> de las fiestas de toros, cañas y alcancías (1641). Es un dato notable: la obra de Terrazas y la de Sandoval Zapata, en cambio, nos llegó manuscrita.</p>
        <p>Queda mucho por investigar. La <i>Relación</i> todavía puede analizarse desde muchos puntos de vista, y el poema sobre las fiestas de toros y el juego de cañas amerita más estudio: <a href="https://www.cervantesvirtual.com/obra/para-el-corpus-de-la-lirica-colonial-las-fiestas-de-toros-juego-de-canas-y-alcancias-de-maria-de-estrada-medinilla-847980/" target="_blank" rel="noopener">«Para el corpus de la lírica colonial: las fiestas de toros, juego de cañas y alcancías de María de Estrada Medinilla»</a>.</p>
        <h3>El certamen y la oliva</h3>
        <p>En la Nueva España eran frecuentes los certámenes poéticos. Participar en uno significaba ceñirse no solo a un tema muy específico, sino también a las formas métricas que pedía cada sección. Estas décimas ganaron el primer lugar en una sección del certamen poético de 1633 dedicada a la misteriosa oliva que se le apareció a san Pedro Nolasco. Los versos del premio llamaron a la autora «Musa añadida»: una décima musa.</p>
        <p>Nolasco (siglo <span style="font-variant:small-caps">xiii</span>) fundó la Orden de la Merced, dedicada a rescatar a los cristianos cautivos. Según la tradición, soñó con un olivo frondoso que unas gentes incultas destrozaban; el olivo renacía de sí mismo y Nolasco, sentado bajo sus ramas, lo defendía. La oliva representaba a la Iglesia, que sufría a través de los cristianos que estaban presos en tierras enemigas: atacarlos a ellos era atacarla a ella. Por eso Nolasco decidió fundar una orden para rescatarlos. Recuerda además que en la Biblia el olivo es señal de paz: la paloma volvió al arca de Noé con un ramo de olivo cuando bajaron las aguas del diluvio (Génesis 8, 10-11).</p>
        <p>Estrada de Medinilla leía con atención a Góngora: encontrarás hipérbatos y cultismos. Las notas debajo del poema explican las palabras y referencias difíciles a partir de la edición de Tenorio.</p>

      lectura: `
        <h3>Recuerda</h3>
        <ul>
          <li><strong>Sinalefa:</strong> la vocal final de una palabra y la inicial de la siguiente se unen en una sola sílaba. A veces se hace aunque haya una coma en medio.</li>
          <li><strong>Hiato:</strong> dos vocales fuertes seguidas (<i>a, e, o</i>) dentro de una palabra van en sílabas distintas: <i>Mor-fe-o</i>.</li>
          <li><strong>Final del verso:</strong> si la última palabra es aguda se suma una sílaba; si es esdrújula se resta una.</li>
          <li><strong>Arte menor:</strong> versos de ocho sílabas o menos. Su rima se marca con letras minúsculas.</li>
        </ul>

const pendientes = i => UNIDAD.partes[i].preguntas.filter(q => !answered(q)).length;
const unlocked = i => { for (let k = 0; k < Math.min(i, N_PARTES); k++) if (pendientes(k)) return false; return true; };
const AUTO = ["opcion", "numero", "rima", "silabas", "acentos", "acepcion", "corta", "oposicion"];
/* ejercicio «oposicion»: marcar en q.rango los términos del lado contrario a q.dados */
const VACIAS = ["a", "al", "de", "del", "el", "la", "lo", "los", "las", "en", "que", "si", "no", "y", "todo"];
const esDado = (q, ln, w) => q.dados.some(d => d.v === ln && norm(d.p) === norm(w));
function oposicionRes(q, m) {
  const ks = Object.keys(m || {});
  const hit = t => ks.some(k => +k.split("-")[0] === t.v && t.palabras.some(p => norm(p) === norm(tokWord(k))));
  const enTermino = k => q.terminos.some(t => +k.split("-")[0] === t.v && t.palabras.some(p => norm(p) === norm(tokWord(k))));
  return { found: q.terminos.filter(hit), missed: q.terminos.filter(t => !hit(t)), extra: sortKeys(ks.filter(k => !enTermino(k) && !VACIAS.includes(norm(tokWord(k))))) };
}
function sortKeys(ks) { return ks.slice().sort((a, b) => { const [la, wa] = a.split("-").map(Number), [lb, wb] = b.split("-").map(Number); return la - lb || wa - wb; }); }
function tokWord(k) { const [l, w] = k.split("-").map(Number); return tokens(VERSOS[l - 1])[w].w; }
/* qué términos de la unidad encontró el alumno y qué marcó de más */
function seleccionRes(q, m) {
  const ks = Object.keys(m || {});
  const hit = t => ks.filter(k => +k.split("-")[0] === t.v && t.palabras.some(p => norm(p) === norm(tokWord(k))));
  const used = new Set(), found = [], missed = [];
  q.terminos.forEach(t => { const h = hit(t); h.forEach(k => used.add(k)); (h.length ? found : missed).push(t); });
  return { found, missed, extra: sortKeys(ks.filter(k => !used.has(k))) };
}
const enNota = (ln, w) => (UNIDAD.notas || []).some(n => n.v === ln && norm(n.termino).split(/[^a-zñ]+/).includes(norm(w)));
function pickPoem(q, m, done) {
  let n = 0;
  return UNIDAD.poema.map(est => '<div class="stanza">' + est.map(v => {
    const ln = ++n;
    return tokens(v).map((t, wi) => {
      const k = ln + "-" + wi;
      if (q.tipo === "seleccion" && enNota(ln, t.w)) return `${esc(t.pre)}<span class="tok-nota" title="Ya la explica una nota de la edición">${esc(t.w)}</span>${esc(t.post)}`;
      return `${esc(t.pre)}<button class="tok ${k in m ? "on" : ""}" data-act="tok" data-q="${q.id}" data-k="${k}" aria-pressed="${k in m}" ${done ? "disabled" : ""}>${esc(t.w)}</button>${esc(t.post)}`;
    }).join(" ");
  }).join("<br>") + "</div>").join("");
}
function simil(a, b) {
  const w = s => norm(s).replace(/[^a-zñ\s]/g, " ").split(/\s+/).filter(Boolean);
  const A = w(a), B = w(b); if (!A.length) return 0;
  const pool = A.slice(); let hits = 0;
  B.forEach(x => { const i = pool.indexOf(x); if (i >= 0) { hits++; pool.splice(i, 1); } });
  return A.length > B.length * 2 ? 0 : hits / B.length;
}
const isL = c => /\p{L}/u.test(c);
function firstL(v) { for (let i = 0; i < v.length; i++) if (isL(v[i])) return i; return 0; }
/* inicios de sílaba (índices de letra) a partir de la solución con barras */
function solB(q) { const out = []; let vi = 0, pend = false; for (const c of q.solucion) { if (c === "|") { pend = true; continue; } if (pend && isL(c)) { out.push(vi); pend = false; } vi++; } return out; }
function sylOf(v, B) {
  const syl = []; let n = 0; const f = firstL(v);
  for (let i = 0; i < v.length; i++) if (isL(v[i])) { if (i === f || B.has(i)) n++; syl[i] = n; }
  for (let i = 0; i < v.length; i++) if (!isL(v[i])) {
    let p = i - 1; while (p >= 0 && !isL(v[p])) p--;
    let x = i + 1; while (x < v.length && !isL(v[x])) x++;
    syl[i] = p >= 0 && x < v.length && syl[p] === syl[x] ? syl[p] : 0;
  }
  return { syl, n };
}
function divText(v, B) {
  const { syl } = sylOf(v, B); let out = "", prev = 0;
  for (let i = 0; i < v.length; i++) { const c = v[i];
    if (isL(c)) { if (prev && syl[i] !== prev) out += "-"; out += c; prev = syl[i]; }
    else if (c === " " && syl[i]) out += "‿"; }
  return out;
}

/* ---------- pestañas ---------- */
function renderTabs() {
  const items = UNIDAD.partes.map((p, i) => {
    const done = p.preguntas.filter(answered).length, tot = p.preguntas.length, lk = !unlocked(i);
    return `<button class="tab ${lk ? "locked" : ""}" data-act="nav" data-i="${i}" aria-current="${S.sec === i}" ${lk ? 'aria-disabled="true" title="Responde primero las partes anteriores"' : ""}>${i + 1}. ${esc(p.nombre)} <span class="count ${done === tot ? "full" : ""}">${done}/${tot}</span></button>`;
  });

/* ---------- preguntas ---------- */
function quote(q) {
  if (!q.versos) return "";
  return `<p class="verse-quote">${q.versos.map(n => esc(VERSOS[n - 1])).join("<br>")}</p>`;
}
function head(q, tag) {
  return `<div class="q-head"><span class="q-num">${q.n}</span><p>${q.enunciado}</p>${tag ? `<span class="tag">${tag}</span>` : ""}</div>`;
}
function renderQ(q) {
  const s = st(q.id), done = !!s.done;
  if (q.tipo === "acepcion" && !q.enunciado) q.enunciado = `«${esc(q.forma)}» (v. ${q.verso}). Busca: <b>${esc(q.lema)}</b>`;
  if (q.requiere && !isDone(QS[q.requiere])) return `<div class="q locked-q" id="q-${q.id}"><div class="q-head"><span class="q-num">${q.n}</span><p>Pregunta bloqueada</p></div><p class="locked-msg">Se abrirá cuando respondas la pregunta ${QS[q.requiere].n}.</p></div>`;
  let body = "";
  if (q.tipo === "opcion") {
    body = `<div class="opts">${q.opciones.map((o, i) => {
      let cls = done ? "locked" : "";

      else if (done && s.sel === i) cls += " wrong";
      return `<label class="opt ${cls}"><input type="radio" name="${q.id}" value="${i}" ${s.sel === i ? "checked" : ""} ${done ? "disabled" : ""}><span>${o}</span></label>`;
    }).join("")}</div>`;
    body += feedback(q, s, 2);
  } else if (q.tipo === "numero") {
    body = `<p class="verse-quote">${esc(VERSOS[q.verso - 1])}</p>
      <div class="row"><label for="n-${q.id}">Sílabas métricas</label><input class="num" id="n-${q.id}" type="number" min="1" max="20" inputmode="numeric" value="${s.val ?? ""}" ${done ? "disabled" : ""}></div>`;

        const on = showSol ? q.terminos.some(x => x.v === ln && x.palabras.some(p => norm(p) === norm(t.w))) : k in m;
        return `${esc(t.pre)}<button class="tok ${on ? "on" : ""}" data-act="tok" data-q="${q.id}" data-k="${k}" aria-pressed="${on}" ${done ? "disabled" : ""}>${esc(t.w)}</button>${esc(t.post)}`;
      }).join(" ") + "<br>";
    }));
    body = `<p class="leyenda"><span class="tok-dado">Así</span> aparecen los términos del lado de la vigilancia. Haz clic en los del lado contrario.</p><div class="pick">${html}</div>` + feedback(q, s, 3);
  } else if (q.tipo === "corta") {
    body = quote(q) + `<input class="txt" id="c-${q.id}" data-q="${q.id}" data-f="texto" value="${esc(s.texto || "")}" placeholder="Escribe el sujeto" autocomplete="off" ${done ? "readonly" : ""}>` + feedback(q, s, 3);
  } else if (q.tipo === "silabas") {

      <div class="row"><label for="a-${q.id}">Tipo de endecasílabo</label><select id="a-${q.id}" data-tipo="${q.id}" ${done ? "disabled" : ""}><option value=""></option>${q.tipos.map(t => `<option ${(showSol ? q.tipoCorrecto : s.tipo) === t ? "selected" : ""}>${t}</option>`).join("")}</select></div>`;

      <div class="dict">${q.palabras.map((p, i) => {
        const v = it[i] || {};
        return `<div class="dict-item"><h4>«${esc(p.forma)}» <span>v. ${p.verso} · busca: ${esc(p.lema)}</span></h4>
          <label for="d-${q.id}-${i}-def">Acepción de Autoridades<textarea id="d-${q.id}-${i}-def" data-q="${q.id}" data-f="def" data-i="${i}" ${done ? "readonly" : ""}>${esc(v.def || "")}</textarea></label>
          <label for="d-${q.id}-${i}-sen">Qué significa en el verso<textarea id="d-${q.id}-${i}-sen" data-q="${q.id}" data-f="sen" data-i="${i}" ${done ? "readonly" : ""}>${esc(v.sen || "")}</textarea></label></div>`;
      }).join("")}</div>`;
    if (!done) body += `<div class="row"><button class="btn" data-act="save" data-q="${q.id}">Guardar definiciones</button>${s.msg ? `<span class="fb bad">${esc(s.msg)}</span>` : ""}</div>`;

function diag(q, s) {

      <p class="lead">${ENVIO_URL ? "Cuando termines, envía tus respuestas desde aquí. Con eso tu actividad queda entregada." : "Cuando termines, copia tus respuestas y entrégalas en la tarea de Classroom. Así tu profesor sabe que completaste la actividad y puede revisar tus respuestas abiertas."}</p></div>
    <table class="summary"><thead><tr><th>Parte</th><th>Respondidas</th><th>Estado</th></tr></thead><tbody>${rows}</tbody></table>
    ${UNIDAD.avisoFinal ? `<aside class="extra"><p class="extra-eyebrow">Antes de entregar</p><p>${esc(UNIDAD.avisoFinal.texto)}</p><a class="video-link" href="${esc(UNIDAD.avisoFinal.enlace)}" target="_blank" rel="noopener"><span class="doc" aria-hidden="true"></span><span><strong>${esc(UNIDAD.avisoFinal.etiqueta)}</strong><br>Se abre en Google Drive</span></a></aside>` : ""}
    <div class="fb bad" id="nameWarn" ${S.nombre.trim() && correoValido(S.correo) ? "hidden" : ""}><p>Escribe tu nombre completo y tu correo en la parte superior antes de entregar.</p></div>
    ${envio}
    ${ENVIO_URL ? `<p>Puedes copiar tus respuestas y pegarlas donde quieras; no hace falta para entregar.</p>` : `<ol class="steps">
      <li>Pulsa <strong>Copiar respuestas</strong>.</li>
      <li>En Classroom, abre la tarea y elige <strong>Añadir o crear → Documentos</strong>.</li>
      <li>Pega tus respuestas en el documento y vuelve a la tarea.</li>
      <li>Pulsa <strong>Entregar</strong>.</li>
    </ol>`}
    <div class="row"><button class="btn ${ENVIO_URL ? "ghost" : ""}" data-act="copy">Copiar respuestas</button><span id="copyMsg" role="status"></span></div>
    <textarea class="report" id="report" readonly aria-label="Tus respuestas"></textarea>
    <div class="confirm" id="resetBox"><button class="btn ghost" data-act="reset">Borrar mis respuestas y empezar de nuevo</button></div>`;
  renderReport();
}

function renderNext() {
  const el = document.getElementById("nextRow"); if (!el || S.sec >= N_PARTES) return;
  const faltan = pendientes(S.sec);
  const label = S.sec + 1 < N_PARTES ? "Siguiente: " + esc(UNIDAD.partes[S.sec + 1].nombre) : "Ir a la entrega";
  el.innerHTML = `<button class="btn ${faltan ? "ghost" : ""} next" data-act="nav" data-i="${S.sec + 1}" ${faltan ? "disabled" : ""}>${label} →</button>`
    + (faltan ? `<span class="next-msg">Para continuar, responde ${faltan === 1 ? "la pregunta que falta" : "las " + faltan + " preguntas que faltan"} en esta parte. Cualquier respuesta cuenta.</span>` : "");
}
function render() { if (!unlocked(S.sec)) S.sec = 0; renderTabs(); renderPart(); }

/* ---------- eventos ---------- */
document.addEventListener("click", e => {
  const b = e.target.closest("[data-act]"); if (!b) return;
  const act = b.dataset.act, q = QS[b.dataset.q];
  if (act === "nav") { const to = Math.min(+b.dataset.i, N_PARTES); if (!unlocked(to)) return; S.sec = to; save(); render(); document.getElementById("part").scrollIntoView({ block: "start" }); window.scrollTo({ top: 0 }); }
  else if (act === "check") { check(q); save(); rerender(q.id); }
  else if (act === "ideas") {
    const s = st(q.id);
    if (!(s.texto || "").trim()) s.msg = "Escribe algo antes de revisar.";
    else { s.msg = ""; s.revisado = s.texto; }
    save(); rerender(q.id);
  }
  else if (act === "save") { saveOpen(q); save(); rerender(q.id); }
  else if (act === "ch") {
    const s = st(q.id), v = VERSOS[q.verso - 1]; let i = +b.dataset.i; s.msg = "";
    if (i > 0 && ["rr", "ll", "ch"].includes((v[i - 1] + v[i]).toLowerCase())) i--;
    if (i === firstL(v)) return;
    s.b = s.b || []; const k = s.b.indexOf(i); if (k >= 0) s.b.splice(k, 1); else s.b.push(i);
    save(); rerender(q.id);
  }
  else if (act === "acc") {
    const s = st(q.id), i = +b.dataset.i; s.msg = ""; s.sel = s.sel || [];
    const k = s.sel.indexOf(i); if (k >= 0) s.sel.splice(k, 1); else s.sel.push(i);
    save(); rerender(q.id);
  }
  else if (act === "tok") {
    const s = st(q.id); s.marcadas = s.marcadas || {}; s.msg = "";
    if (b.dataset.k in s.marcadas) delete s.marcadas[b.dataset.k]; else s.marcadas[b.dataset.k] = "";
    save(); rerender(q.id);
  }
  else if (act === "send") {
    const msg = document.getElementById("sendMsg");
    if (!S.nombre.trim()) { msg.textContent = "Escribe tu nombre completo en la parte superior."; nombre.focus(); return; }
    if (!correoValido(S.correo)) { msg.textContent = "Revisa tu correo en la parte superior: debe tener la forma nombre@dominio.com, sin espacios ni acentos."; correo.focus(); return; }
    const t = stats();
    b.disabled = true; msg.textContent = "Enviando…";
    fetch(ENVIO_URL, { method: "POST", headers: { "Content-Type": "text/plain;charset=utf-8" },
      body: JSON.stringify({ unidad: UNIDAD.id, titulo: `${UNIDAD.autor}, «${UNIDAD.titulo}»`, curso: `${UNIDAD.curso} · ${UNIDAD.bloque}`, nombre: S.nombre.trim(), correo: S.correo.trim(), avance: `${t.hechas}/${t.total}`, informe: buildReport() }) })
      .then(r => r.text())
      .then(txt => {
        let d; try { d = JSON.parse(txt); } catch (e) { throw new Error("servicio"); }
        if (!d.ok) throw new Error(d.error === "correo" ? "correo" : "servidor");
        S.enviado = new Date().toISOString(); save();
        msg.textContent = `Enviado: tu actividad cuenta como entregada. Revisa tu correo (${S.correo.trim()}); si no lo ves en unos minutos, busca también en la carpeta de spam.`;
      })
      .catch(err => {
        msg.textContent = err.message === "correo" ? "El servicio no aceptó tu correo. Revisa que esté bien escrito, sin espacios ni acentos."
          : err.message === "servicio" ? "El servicio de envío no está disponible en este momento. Copia tus respuestas y entrégalas en Classroom, y avisa a tu profesor."
          : "No se pudo enviar. Revisa tu conexión e inténtalo de nuevo; si sigue fallando, copia tus respuestas y entrégalas en Classroom.";
      })
      .finally(() => { b.disabled = false; });
  }
  else if (act === "copy") {
    const r = document.getElementById("report"), msg = document.getElementById("copyMsg");
    r.value = buildReport();
    const fallback = () => { r.focus(); r.select(); msg.textContent = "Texto seleccionado: cópialo con Ctrl+C (o Cmd+C)."; };
    try { navigator.clipboard.writeText(r.value).then(() => { msg.textContent = "Copiado. Ahora pégalo en el documento de Classroom."; }, fallback); } catch (err) { fallback(); }
  }
  else if (act === "reset") {
    document.getElementById("resetBox").innerHTML = `<span>¿Seguro? Se borrarán todas tus respuestas en este navegador.</span><button class="btn danger" data-act="reset-yes">Sí, borrar</button><button class="btn ghost" data-act="nav" data-i="${N_PARTES}">Cancelar</button>`;
  }
  else if (act === "reset-yes") { S = { nombre: S.nombre, correo: S.correo, r: {}, sec: 0 }; save(); render(); }
});
document.addEventListener("input", e => {
  const t = e.target, id = t.dataset.q; if (!id || t.readOnly) return;
  const s = st(id), f = t.dataset.f;
  if (f === "texto") s.texto = t.value;
  else if (f === "def" || f === "sen") { s.items = s.items || {}; (s.items[t.dataset.i] = s.items[t.dataset.i] || {})[f] = t.value; }
  else if (f === "nota") { s.marcadas[t.dataset.k] = t.value; }
  save();
});
document.addEventListener("change", e => {
  const t = e.target;
  if (t.dataset.tipo) { st(t.dataset.tipo).tipo = t.value; save(); }
  if (t.dataset.rima) { const s = st(t.dataset.rima); s.letras = s.letras || []; s.letras[+t.dataset.i] = t.value; save(); }
});

render();
</script>

</body>
</html>
