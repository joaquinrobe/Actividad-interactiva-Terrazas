<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<style>:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}body{margin:0}img{max-width:100%}[hidden]{display:none!important}</style>
<title>Taller de poesía novohispana</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IM+Fell+English:ital@0;1&family=Literata:ital,opsz,wght@0,7..72,400;0,7..72,600;1,7..72,400&family=Public+Sans:wght@400;500;600;700&display=swap">
<style>
/* Layout: cabecera con datos del alumno, pestañas por parte de la unidad; columna de trabajo + soneto fijo al lado (arriba y plegable en el teléfono). */
:root {
  --paper: #F3F4F1;
  --surface: #FFFFFF;
  --ink: #1E2230;
  --muted: #5B6070;
  --line: #D8DAD4;
  --grana: #A3203A;      /* grana cochinilla */
  --grana-soft: #F6E4E7;
  --ok: #2B7A4B;
  --ok-soft: #E2F1E7;
  --bad: #AF4229;
  --bad-soft: #F8E5DF;
  --syl-a: #F6E4E7;
  --syl-b: #E3E8F1;
  --f-display: "IM Fell English", "Iowan Old Style", Georgia, serif;
  --f-read: "Literata", "Iowan Old Style", Georgia, serif;
  --f-ui: "Public Sans", system-ui, -apple-system, "Segoe UI", sans-serif;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --paper: #14161D; --surface: #1C1F28; --ink: #E8E7E2; --muted: #A2A6B2; --line: #2F3341;
    --grana: #E46A80; --grana-soft: #3A1F27; --ok: #6CC290; --ok-soft: #1C3327; --bad: #E78C73; --bad-soft: #3B251F; --syl-a: #3A1F27; --syl-b: #22293A;
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --paper: #14161D; --surface: #1C1F28; --ink: #E8E7E2; --muted: #A2A6B2; --line: #2F3341;
  --grana: #E46A80; --grana-soft: #3A1F27; --ok: #6CC290; --ok-soft: #1C3327; --bad: #E78C73; --bad-soft: #3B251F; --syl-a: #3A1F27; --syl-b: #22293A;
  color-scheme: dark;
}
* { box-sizing: border-box; }
body { background: var(--paper); color: var(--ink); font-family: var(--f-ui); font-size: 17px; line-height: 1.55; }
.wrap { max-width: 1180px; margin: 0 auto; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); }

header.top { border-bottom: 1px solid var(--line); background: var(--surface); }
header.top .wrap { padding-block: 22px 18px; display: flex; flex-wrap: wrap; gap: 16px 32px; align-items: flex-end; justify-content: space-between; }
.eyebrow { font-size: 14px; letter-spacing: .08em; text-transform: uppercase; color: var(--grana); font-weight: 600; margin: 0 0 4px; }
h1 { font-family: var(--f-display); font-weight: 400; font-size: clamp(30px, 4.5vw, 42px); line-height: 1.1; margin: 0; text-wrap: balance; }
h1 em { font-style: italic; }
.byline { color: var(--muted); margin: 6px 0 0; }
.course { color: var(--muted); font-size: 15px; margin: 2px 0 0; }
.student { display: flex; flex-wrap: wrap; gap: 10px; }
.student label { display: flex; flex-direction: column; font-size: 14px; color: var(--muted); font-weight: 500; gap: 3px; }
.student input { font: inherit; font-size: 17px; color: var(--ink); background: var(--paper); border: 1px solid var(--line); border-radius: 6px; padding: 7px 10px; width: 240px; max-width: 100%; }
.student label.small input { width: 110px; }

nav.tabs { position: sticky; top: env(safe-area-inset-top, 0px); z-index: 5; background: var(--paper); border-bottom: 1px solid var(--line); }
body::before { content: ""; position: fixed; inset: 0 0 auto; height: env(safe-area-inset-top, 0px); z-index: 10; background: var(--paper); }
nav.tabs .wrap { display: flex; gap: 4px; overflow-x: auto; scrollbar-width: none; }
.tab { font: inherit; font-weight: 500; color: var(--muted); background: none; border: 0; border-bottom: 2px solid transparent; padding: 12px 12px 10px; cursor: pointer; white-space: nowrap; display: flex; gap: 8px; align-items: center; }
.tab:hover { color: var(--ink); }
.tab[aria-current="true"] { color: var(--ink); border-bottom-color: var(--grana); }
.tab .count { font-size: 13px; font-variant-numeric: tabular-nums; background: var(--surface); border: 1px solid var(--line); border-radius: 99px; padding: 0 7px; color: var(--muted); }
.tab .count.full { background: var(--ok-soft); border-color: transparent; color: var(--ok); }

main .wrap { display: grid; grid-template-columns: minmax(0, 1fr) 450px; gap: 32px; padding-block: 28px 64px; align-items: start; }
@media (max-width: 900px) { main .wrap { grid-template-columns: minmax(0, 1fr); } aside.poem-side { order: -1; } }

aside.poem-side { position: sticky; top: calc(env(safe-area-inset-top, 0px) + 64px); }
@media (max-width: 900px) { aside.poem-side { position: static; } }
.poem-card { background: var(--surface); border: 1px solid var(--line); border-radius: 8px; }
.poem-card summary { cursor: pointer; padding: 12px 16px; font-weight: 600; font-size: 15px; letter-spacing: .04em; text-transform: uppercase; color: var(--muted); list-style: none; display: flex; justify-content: space-between; }
.poem-card summary::-webkit-details-marker { display: none; }
.poem-card summary::after { content: "Mostrar"; text-transform: none; letter-spacing: 0; font-weight: 500; color: var(--grana); }
.poem-card[open] summary::after { content: "Ocultar"; }
.poem-body { padding: 0 16px 16px; }
.poem-title { font-family: var(--f-display); font-size: 25px; text-align: center; margin: 4px 0 12px; }
.poem { font-family: var(--f-read); font-size: clamp(14px, 4vw, 17px); line-height: 1.6; margin: 0; overflow-x: auto; }
.vl span:last-child { white-space: nowrap; }
.stanza { margin: 0 0 12px; }
.vl { display: grid; grid-template-columns: 22px 1fr; gap: 6px; }
.vn { font-family: var(--f-ui); font-size: 12px; color: var(--muted); text-align: right; padding-top: 5px; font-variant-numeric: tabular-nums; }
.ref { font-size: 14px; color: var(--muted); border-top: 1px solid var(--line); padding-top: 10px; margin: 6px 0 0; line-height: 1.45; }
.ref .sc { font-variant: small-caps; letter-spacing: .03em; }

section.part { min-width: 0; display: flex; flex-direction: column; gap: 22px; }
.part-head h2 { font-family: var(--f-display); font-weight: 400; font-size: 34px; margin: 0; line-height: 1.15; }
.part-head .lead { font-family: var(--f-read); color: var(--muted); margin: 8px 0 0; max-width: 64ch; }
.reading { font-family: var(--f-read); font-size: 18px; line-height: 1.7; max-width: 66ch; }
.reading h3 { font-family: var(--f-ui); font-size: 15px; letter-spacing: .07em; text-transform: uppercase; color: var(--grana); margin: 22px 0 6px; }
.reading p { margin: 0 0 12px; }
.reading ul { margin: 0 0 12px; padding-left: 20px; }
.reading li { margin-bottom: 6px; }
.reading blockquote { margin: 8px 0 14px; padding-left: 14px; border-left: 2px solid var(--grana); font-style: italic; }

.q { background: var(--surface); border: 1px solid var(--line); border-radius: 8px; padding: 18px 20px; display: flex; flex-direction: column; gap: 12px; }
.q.done { border-color: color-mix(in srgb, var(--ok) 35%, var(--line)); }
.q-head { display: flex; gap: 12px; align-items: baseline; }
.q-num { font-family: var(--f-display); font-size: 23px; color: var(--grana); min-width: 22px; }
.q-head p { margin: 0; font-family: var(--f-read); font-size: 18px; }
.q-head .tag { margin-left: auto; font-size: 13px; color: var(--muted); white-space: nowrap; }
.verse-quote { font-family: var(--f-read); font-style: italic; background: var(--paper); border-radius: 6px; padding: 10px 14px; margin: 0; }
.opts { display: flex; flex-direction: column; gap: 6px; }
.opt { display: flex; gap: 10px; align-items: flex-start; padding: 8px 12px; border: 1px solid var(--line); border-radius: 6px; cursor: pointer; }
.opt:hover { border-color: var(--muted); }
.opt input { margin-top: 4px; accent-color: var(--grana); }
.opt.right { background: var(--ok-soft); border-color: transparent; }
.opt.wrong { background: var(--bad-soft); border-color: transparent; }
.opt.locked { cursor: default; }

textarea, input.num, select { font: inherit; color: var(--ink); background: var(--paper); border: 1px solid var(--line); border-radius: 6px; padding: 8px 10px; }
textarea { width: 100%; min-height: 96px; resize: vertical; font-family: var(--f-read); font-size: 17px; line-height: 1.55; }
textarea[readonly] { background: transparent; border-style: dashed; }
input.txt { font: inherit; font-family: var(--f-read); font-size: 17px; color: var(--ink); background: var(--paper); border: 1px solid var(--line); border-radius: 6px; padding: 8px 10px; width: 100%; max-width: 360px; }
input.txt[readonly] { background: transparent; border-style: dashed; }
input.num { width: 80px; font-variant-numeric: tabular-nums; }
:focus-visible { outline: 2px solid var(--grana); outline-offset: 2px; }

.row { display: flex; flex-wrap: wrap; gap: 10px; align-items: center; }
button.btn { font: inherit; font-weight: 600; font-size: 16px; border: 1px solid var(--ink); background: var(--ink); color: var(--paper); border-radius: 6px; padding: 8px 16px; cursor: pointer; }
button.btn:hover { opacity: .88; }
button.btn.ghost { background: transparent; color: var(--ink); border-color: var(--line); }
button.btn.danger { background: var(--bad); border-color: var(--bad); color: #fff; }

.fb { border-radius: 6px; padding: 10px 14px; font-size: 16px; }
.fb p { margin: 0 0 6px; } .fb p:last-child { margin: 0; }
.fb.ok { background: var(--ok-soft); }
.fb.bad { background: var(--bad-soft); }
.fb.info { background: var(--paper); border: 1px solid var(--line); }
.fb strong { font-weight: 600; }
.fb .label { font-size: 13px; letter-spacing: .07em; text-transform: uppercase; font-weight: 700; color: var(--grana); display: block; margin-bottom: 4px; }
.fb .model { font-family: var(--f-read); }
.syl { font-family: var(--f-read); letter-spacing: .02em; }

.rhyme { display: grid; grid-template-columns: 24px minmax(0, 1fr) 64px 20px; gap: 6px 10px; align-items: center; font-family: var(--f-read); }
.rhyme .vn { padding: 0; }
.rhyme .gap { grid-column: 1 / -1; height: 6px; }
.rhyme mark { background: var(--grana-soft); color: inherit; border-radius: 3px; padding: 0 2px; }
.rhyme select { padding: 4px 6px; }
.rhyme .mk { font-size: 15px; font-family: var(--f-ui); }
.mk.y { color: var(--ok); } .mk.n { color: var(--bad); }

.pick { font-family: var(--f-read); font-size: 18px; line-height: 2; background: var(--paper); border-radius: 6px; padding: 12px 14px; }
.pick .stanza { margin-bottom: 10px; }
.tok { font: inherit; background: none; border: 0; padding: 0 2px; border-radius: 3px; color: var(--ink); cursor: pointer; }
.tok:hover { background: var(--grana-soft); }
.tok.on { background: var(--grana); color: #fff; }
.tok:disabled { cursor: default; }
.notes { display: flex; flex-direction: column; gap: 10px; }
.note label { font-weight: 600; font-size: 16px; display: block; margin-bottom: 4px; }
.note label span { color: var(--muted); font-weight: 400; }
.note textarea { min-height: 60px; }

.opt .def { font-family: var(--f-read); }
.dict { display: flex; flex-direction: column; gap: 14px; }
.dict-item { border-top: 1px solid var(--line); padding-top: 12px; display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 1fr); gap: 8px 14px; }
.dict-item h4 { grid-column: 1 / -1; margin: 0; font-family: var(--f-read); font-size: 18px; font-weight: 600; }
.dict-item h4 span { font-family: var(--f-ui); font-weight: 400; font-size: 15px; color: var(--muted); }
.dict-item label { font-size: 14px; color: var(--muted); font-weight: 500; display: flex; flex-direction: column; gap: 3px; }
.dict-item textarea { min-height: 70px; }
@media (max-width: 560px) { .dict-item { grid-template-columns: minmax(0, 1fr); } }
a { color: var(--grana); }
.ideas ul { margin: 0; padding: 0; list-style: none; display: flex; flex-direction: column; gap: 6px; }
.ideas li { padding-left: 22px; position: relative; }
.ideas li::before { position: absolute; left: 0; font-weight: 700; }
.ideas li.si::before { content: "✓"; color: var(--ok); }
.ideas li.no::before { content: "→"; color: var(--grana); }

.syl-line { font-family: var(--f-read); font-size: 28px; line-height: 1.5; background: var(--paper); border-radius: 6px; padding: 26px 14px 12px; display: flex; flex-wrap: wrap; row-gap: 22px; }
.syl-line .w { white-space: nowrap; display: inline-flex; }
.syl-line .sp { white-space: pre; }
.ch { font: inherit; color: var(--ink); background: none; border: 0; margin: 0; padding: 0 1px; cursor: pointer; position: relative; border-radius: 0; }
.ch:not(:disabled):hover { outline: 1px solid var(--grana); outline-offset: -1px; }
.ch:disabled { cursor: default; }
.ch.a, .sp.a { background: var(--syl-a); }
.ch.b, .sp.b { background: var(--syl-b); }
.ch.start { box-shadow: inset 2px 0 0 var(--grana); }
.ch.start::before { content: attr(data-n); position: absolute; top: -1.35em; left: 1px; font: 600 13px/1 var(--f-ui); color: var(--grana); }
.pu { color: var(--muted); }
.syl-count { margin: 0; font-size: 16px; color: var(--muted); }
.syl-count strong { color: var(--ink); font-variant-numeric: tabular-nums; }
.acc-row { display: flex; flex-wrap: wrap; gap: 6px; }
.acc { font: inherit; font-family: var(--f-read); font-size: 21px; color: var(--ink); background: var(--surface); border: 1px solid var(--line); border-radius: 6px; padding: 6px 10px 4px; min-width: 44px; display: flex; flex-direction: column; align-items: center; cursor: pointer; }
.acc small { font: 500 13px var(--f-ui); color: var(--muted); font-variant-numeric: tabular-nums; }
.acc.on { background: var(--grana); border-color: var(--grana); color: #fff; }
.acc.on small { color: #fff; }
.acc:disabled { cursor: default; }

.next { align-self: flex-start; }
.summary { width: 100%; border-collapse: collapse; font-variant-numeric: tabular-nums; }
.summary td, .summary th { text-align: left; padding: 8px 10px; border-bottom: 1px solid var(--line); }
.summary th { font-size: 14px; text-transform: uppercase; letter-spacing: .06em; color: var(--muted); font-weight: 600; }
.pill { font-size: 14px; border-radius: 99px; padding: 2px 9px; font-weight: 600; }
.pill.ok { background: var(--ok-soft); color: var(--ok); }
.pill.pend { background: var(--grana-soft); color: var(--grana); }
.send { border: 1px solid var(--line); background: var(--surface); border-radius: 8px; padding: 16px 20px; display: flex; flex-direction: column; gap: 10px; }
.send h3, .steps-title { margin: 0; font-size: 18px; }
.send p { margin: 0; }
.steps { margin: 0; padding-left: 20px; font-family: var(--f-read); }
.steps li { margin-bottom: 6px; }
textarea.report { min-height: 260px; font-family: ui-monospace, "SF Mono", Menlo, monospace; font-size: 14px; }
.confirm { display: flex; flex-wrap: wrap; gap: 10px; align-items: center; }
@media (prefers-reduced-motion: no-preference) { .q { transition: border-color .2s; } }
</style>
</head>
<body>

<header class="top">
  <div class="wrap">
    <div>
      <p class="eyebrow" id="eyebrow"></p>
      <h1 id="title"></h1>
      <p class="byline" id="byline"></p>
      <p class="course" id="course"></p>
    </div>
    <div class="student">
      <label for="nombre">Nombre completo<input id="nombre" autocomplete="name" placeholder="Escribe tu nombre"></label>
      <label for="correo">Correo<input id="correo" type="email" autocomplete="email" inputmode="email" placeholder="tu@correo.com"></label>
    </div>
  </div>
</header>
<nav class="tabs" aria-label="Partes de la unidad"><div class="wrap" id="tabs"></div></nav>
<main>
  <div class="wrap">
    <section class="part" id="part"></section>
    <aside class="poem-side">
      <details class="poem-card" id="poemCard">
        <summary>El poema</summary>
        <div class="poem-body" id="poemBody"></div>
      </details>
    </aside>
  </div>
</main>

<script>
/* ================================================================
   UNIDAD DIDÁCTICA. Para crear otra unidad basta con copiar este
   objeto y cambiar el poema, la referencia y las preguntas.
   Tipos de pregunta: opcion, numero, rima, abierta, diccionario, marcar.
   ================================================================ */
const UNIDAD = {
  id: "terrazas-sone-peña",
  programa: "Licenciatura en Letras Hispánicas",
  curso: "Literatura novohispana",
  bloque: "Bloque III: Lírica",
  profesor: "Dr. Joaquín Rodríguez Beltrán",
  autor: "Francisco de Terrazas",
  titulo: "Soñé que de una peña me arrojaba",
  rotulo: "III",
  referencia: '<span class="sc">Terrazas</span>, Francisco, <i>Poesías</i>, ed. de Antonio Castro Leal, Porrúa, México, 1941, p. 5.',
  referenciaTexto: "TERRAZAS, Francisco, Poesías, Ed. de Antonio Castro Leal, Porrúa, México, 1941, p. 5.",
  poema: [
    ["Soñé que de una peña me arrojaba", "quien mi querer sujeto a sí tenía,", "y casi ya en la boca me cogía", "una fiera que abajo me esperaba."],
    ["Yo, con temor buscando, procuraba", "de dónde con las manos me tendría,", "y el filo de una espada la una asía", "y en una yerbezuela la otra hincaba."],
    ["La yerba a más andar la iba arrancando,", "la espada a mí la mano deshaciendo,", "yo más sus vivos filos apretando…"],
    ["¡Oh, mísero de mí, qué mal me entiendo,", "pues huelgo verme estar despedazando", "de miedo de acabar mi mal muriendo!"]
  ],
  partes: [
    {
      id: "contexto", nombre: "Contexto",
      titulo: "El modelo petrarquista",
      lead: "Antes de analizar el poema, conviene saber qué tipo de poesía está imitando Terrazas. Lee esta introducción y responde las preguntas de comprobación.",
      lectura: `
        <h3>Petrarca y su cancionero</h3>
        <p>Francesco Petrarca (1304–1374) reunió en su <i>Canzoniere</i> más de trescientos poemas dedicados a Laura, una dama a la que ama sin ser correspondido. Ese libro se convirtió en el modelo de la poesía amorosa europea durante dos siglos: miles de poetas imitaron sus temas, sus imágenes y sus formas métricas.</p>
        <h3>La llegada a la lengua castellana</h3>
        <p>En la primera mitad del siglo <span style="font-variant:small-caps">xvi</span>, Juan Boscán y Garcilaso de la Vega adaptaron al castellano los versos y las estrofas de la poesía italiana. Sus obras se publicaron juntas en 1543, y desde entonces la manera italiana de escribir poesía amorosa se extendió por España y por América.</p>
        <h3>Rasgos que vas a reconocer</h3>
        <ul>
          <li><strong>El amor como sufrimiento.</strong> El amante padece, pero no quiere dejar de amar: su dolor (su «mal») es también lo que da sentido a su vida.</li>
          <li><strong>La dama inalcanzable.</strong> Es bella, distante y a menudo desdeñosa; tiene poder absoluto sobre la voluntad del amante.</li>
          <li><strong>Las paradojas.</strong> El amor se expresa con contrarios: fuego y hielo, «dulce mal», vivir muriendo.</li>
          <li><strong>La mirada hacia dentro.</strong> El poema describe el estado interior del amante, que se analiza y se lamenta de sí mismo.</li>
          <li><strong>Alegorías y visiones.</strong> Escenas completas (un naufragio, una caída, un sueño) representan ese estado interior. Lo que se cuenta no debe leerse al pie de la letra.</li>
        </ul>
        <h3>Francisco de Terrazas</h3>
        <p>Terrazas (c. 1525–c. 1600) era hijo de un conquistador del mismo nombre y suele considerarse el primer poeta nacido en la Nueva España del que se conserva obra. Varios de sus sonetos aparecen en <i>Flores de baria poesía</i> (1577), un cancionero manuscrito reunido en la Ciudad de México, y Miguel de Cervantes lo elogió en <i>La Galatea</i> (1585). Su poesía muestra que el petrarquismo se cultivaba en la Nueva España con el mismo oficio que en la península.</p>
      `,
      preguntas: [
        { id: "c1", tipo: "opcion", enunciado: "En la tradición petrarquista, ¿cómo vive el amante su sufrimiento?",
          opciones: ["Busca curarse cuanto antes y olvidar a la dama.", "Lo padece, pero no quiere renunciar a él porque es parte de su amor.", "Lo considera un castigo divino por sus pecados.", "No sufre: el amor petrarquista es siempre correspondido."],
          correcta: 1, porque: ["El amante petrarquista no busca curarse: si dejara de sufrir, dejaría de amar.", null, "El sufrimiento nace del amor no correspondido, no de una culpa religiosa: esta poesía es amorosa, no penitencial.", "Es al revés: la dama suele ser inalcanzable o desdeñosa, y de ahí nace el sufrimiento."], explicacion: "El amante petrarquista se aferra a su dolor: dejar de sufrir significaría dejar de amar. Guarda esta idea para el último terceto del poema." },
        { id: "c2", tipo: "opcion", enunciado: "¿Cuál de estas expresiones es una paradoja típica del petrarquismo?",

        <p>La poesía de los siglos <span style="font-variant:small-caps">xvi</span> y <span style="font-variant:small-caps">xvii</span> altera con frecuencia el orden normal de la frase (hipérbaton), separa palabras que van juntas y deja otras sobreentendidas. Prosificar es reescribir un pasaje en el orden habitual del español, sin quitar ni inventar información. Es una manera inicial de asegurarnos de que entendemos la sintaxis: quién hace qué, qué palabra concuerda con cuál, qué complementa a qué. Si no podemos poner un pasaje en prosa, todavía no lo hemos entendido, y cualquier interpretación que hagamos después quedará en el aire.</p>
        <h3>Un ejemplo</h3>
        <p>Esta octava real es del mismo autor, Francisco de Terrazas. Pertenece a <i>Nuevo Mundo y Conquista</i>, un poema épico sobre la conquista de México que quedó inacabado y del que se conservan fragmentos.</p>

          <li><strong>Localiza los verbos conjugados:</strong> <i>te vas consumiendo</i>, <i>ven</i> (escondido en <i>vente</i>), <i>va cundiendo</i>, <i>aprovecha</i>.</li>

  return line.split(" ").map(t => { const m = t.match(/^([¡¿«"]*)(.*?)([.,;:!?…»"]*)$/); return { pre: m[1], w: m[2], post: m[3] }; });
}
const isDone = q => !!(S.r[q.id] && S.r[q.id].done);
const AUTO = ["opcion", "numero", "rima", "silabas", "acentos", "acepcion", "corta"];
function sortKeys(ks) { return ks.slice().sort((a, b) => { const [la, wa] = a.split("-").map(Number), [lb, wb] = b.split("-").map(Number); return la - lb || wa - wb; }); }

/* qué términos de la unidad encontró el alumno y qué marcó de más */
function seleccionRes(q, m) {
  const ks = Object.keys(m || {});
  const hit = t => ks.filter(k => +k.split("-")[0] === t.v && t.palabras.some(p => norm(p) === norm(tokWord(k))));
  const used = new Set(), found = [], missed = [];
  q.terminos.forEach(t => { const h = hit(t); h.forEach(k => used.add(k)); (h.length ? found : missed).push(t); });
  return { found, missed, extra: sortKeys(ks.filter(k => !used.has(k))) };
}
function pickPoem(q, m, done) {
  let n = 0;
  return UNIDAD.poema.map(est => '<div class="stanza">' + est.map(v => {
    const ln = ++n;
    return tokens(v).map((t, wi) => {
      const k = ln + "-" + wi;
      return `${esc(t.pre)}<button class="tok ${k in m ? "on" : ""}" data-act="tok" data-q="${q.id}" data-k="${k}" aria-pressed="${k in m}" ${done ? "disabled" : ""}>${esc(t.w)}</button>${esc(t.post)}`;
    }).join(" ");
  }).join("<br>") + "</div>").join("");
}
function simil(a, b) {
  const w = s => norm(s).replace(/[^a-zñ\s]/g, " ").split(/\s+/).filter(Boolean);
  const A = w(a), B = w(b); if (!A.length) return 0;
  const pool = A.slice(); let hits = 0;
  B.forEach(x => { const i = pool.indexOf(x); if (i >= 0) { hits++; pool.splice(i, 1); } });
  return A.length > B.length * 2 ? 0 : hits / B.length;
}
const isL = c => /\p{L}/u.test(c);
function firstL(v) { for (let i = 0; i < v.length; i++) if (isL(v[i])) return i; return 0; }
/* inicios de sílaba (índices de letra) a partir de la solución con barras */
function solB(q) { const out = []; let vi = 0, pend = false; for (const c of q.solucion) { if (c === "|") { pend = true; continue; } if (pend && isL(c)) { out.push(vi); pend = false; } vi++; } return out; }
function sylOf(v, B) {
  const syl = []; let n = 0; const f = firstL(v);
  for (let i = 0; i < v.length; i++) if (isL(v[i])) { if (i === f || B.has(i)) n++; syl[i] = n; }
  for (let i = 0; i < v.length; i++) if (!isL(v[i])) {
    let p = i - 1; while (p >= 0 && !isL(v[p])) p--;
    let x = i + 1; while (x < v.length && !isL(v[x])) x++;
    syl[i] = p >= 0 && x < v.length && syl[p] === syl[x] ? syl[p] : 0;
  }

}
function divText(v, B) {
  const { syl } = sylOf(v, B); let out = "", prev = 0;

    if (isL(c)) { if (prev && syl[i] !== prev) out += "-"; out += c; prev = syl[i]; }
    else if (c === " " && syl[i]) out += "‿"; }

}

function renderTabs() {

    const done = p.preguntas.filter(isDone).length, tot = p.preguntas.length;

        ${r.extra.length ? `<p>También marcaste ${r.extra.map(k => "«" + esc(tokWord(k)) + "»").join(", ")}; no hace falta ${r.extra.length === 1 ? "buscarla" : "buscarlas"} en esta unidad.</p>` : ""}

function feedback(q, s, max) {
  let out = "";

    const correct = q.tipo === "opcion" ? esc(strip(q.opciones[q.correcta]))
      : q.tipo === "numero" ? q.correcta

      : q.tipo === "acepcion" ? esc(q.opciones ? q.opciones[q.correcta] : q.acepcion)
      : q.tipo === "corta" ? q.respuesta
      : q.tipo === "acentos" ? `sílabas ${q.tonicas.join(", ")}; endecasílabo ${q.tipoCorrecto}`
      : q.correcta.replace(/(....)(....)(...)(...)/, "$1 $2 $3 $4");

      ? `<div class="fb ok"><p><strong>Correcto.</strong></p><p>${q.explicacion}</p></div>`
      : `<div class="fb bad">${diag(q, s)}<p><strong>La respuesta correcta es: ${correct}.</strong></p><p>${q.explicacion}</p></div>`;
  } else {
    if (s.intentos) out = `<div class="fb bad"><p><strong>Todavía no.</strong></p>${diag(q, s)}${q.pista && s.intentos >= 1 ? `<p>Pista: ${q.pista}</p>` : ""}<p>${max - s.intentos === 1 ? "Te queda 1 intento; después verás la respuesta." : "Puedes intentarlo " + (max - s.intentos) + " veces más."}</p></div>`;
    out += `<div class="row"><button class="btn" data-act="check" data-q="${q.id}">Comprobar</button>${s.msg ? `<span class="fb bad">${esc(s.msg)}</span>` : ""}</div>`;
  }
  return out;
}
/* explica por qué la última respuesta no es correcta */
/* comentario según las ideas clave que aparecen en una respuesta abierta */
function ideasFb(q, text) {
  const T = " " + norm(text || "").replace(/[^a-zñ0-9]+/g, " ").trim() + " ";
  const has = c => { c = norm(c).replace(/[^a-zñ0-9* ]+/g, " ").trim(); const star = c.endsWith("*"); c = c.replace(/\*$/, ""); return star ? T.includes(" " + c) : T.includes(" " + c + " "); };
  const items = q.ideas.map(i => {
    if (i.conserva) {
      const miss = i.conserva.filter(w => !has(w));
      return miss.length
        ? `<li class="no">Revisa si conservaste estas palabras del poema: ${miss.map(w => "«" + esc(w) + "»").join(", ")}. Al prosificar mantenemos los sustantivos, verbos, adjetivos y adverbios.</li>`
        : `<li class="si">Conservaste las palabras del poema.</li>`;
    }
    return i.claves.some(has) ? `<li class="si">${esc(i.ok)}</li>` : `<li class="no">${esc(i.falta)}</li>`;
  });
  return `<div class="fb info ideas"><span class="label">Sobre tu respuesta</span><ul>${items.join("")}</ul></div>`;
}
function diag(q, s) {
  const P = t => `<p>${t}</p>`;
  if ((q.tipo === "opcion" || (q.tipo === "acepcion" && q.opciones)) && q.porque && q.porque[s.sel]) return P(q.porque[s.sel]);
  if (q.tipo === "acepcion" && q.modo === "copiar") return P(`Tu texto no coincide con la definición. Comprueba que buscaste «${esc(q.lema)}» y copia la acepción completa, desde el principio hasta antes de «Latín».`);
  if (q.tipo === "corta") {
    const w = norm(s.texto || "").split(/[^a-zñ]+/);
    const e = q.errores.find(x => x.claves.some(c => w.includes(norm(c))));
    return P(e ? e.porque : q.generico);
  }
  if (q.tipo === "rima") return P("Los versos marcados con ✗ no tienen la letra que les toca. Compara cómo terminan, desde la última vocal acentuada, y recuerda que la primera rima que aparece es la A, la segunda la B, etc.");
  if (q.tipo === "silabas") {
    const v = VERSOS[q.verso - 1], sol = solB(q), b = s.b || [], msgs = [];
    const wordAt = i => { let a = i, z = i; while (a > 0 && v[a - 1] !== " ") a--; while (z < v.length && v[z] !== " ") z++; return v.slice(a, z).replace(/[¡!¿?,.;:…«»]/g, ""); };
    const prevWord = i => { let k = i - 1; while (k >= 0 && v[k] === " ") k--; return wordAt(k); };
    const pausa = i => { let k = i - 1; while (k >= 0 && !isL(v[k])) { if (/[,;:.!?…]/.test(v[k])) return true; k--; } return false; };
    const atWordStart = i => { let k = i - 1; while (k >= 0 && !isL(v[k]) && v[k] !== " ") k--; return k >= 0 && v[k] === " "; };
    b.filter(i => !sol.includes(i)).sort((x, y) => x - y).forEach(i => msgs.push(atWordStart(i)
      ? `Entre «${esc(prevWord(i))}» y «${esc(wordAt(i))}» hay sinalefa: esas dos vocales se pronuncian en una sola sílaba.`
      : `Sobra una división dentro de «${esc(wordAt(i))}». ¿Hay ahí un diptongo, o una consonante que va con la vocal siguiente?`));
    sol.filter(i => !b.includes(i)).sort((x, y) => x - y).forEach(i => msgs.push(atWordStart(i)
      ? `«${esc(prevWord(i))}» y «${esc(wordAt(i))}» van en sílabas distintas: ${!(/[aeiouáéíóúy]h?$/i.test(prevWord(i)) && /^h?[aeiouáéíóú]/i.test(wordAt(i))) ? "no hay dos vocales en contacto, así que no puede haber sinalefa." : pausa(i) ? "la pausa que marca la puntuación impide la sinalefa." : "aquí las vocales no se unen en una sola sílaba."}`
      : `Falta separar una sílaba dentro de «${esc(wordAt(i))}».`));
    return msgs.map(P).join("");
  }
  if (q.tipo === "acentos") {
    const sel = s.sel || [], opt = q.opcionales || [], msgs = [];
    sel.filter(x => !q.tonicas.includes(x) && !opt.includes(x)).sort((x, y) => x - y).forEach(x => msgs.push(`La sílaba «${esc(q.silabas[x - 1])}» (${x}.ª) no lleva un acento principal: puede ser átona o pertenecer a una palabra átona.`));
    const miss = q.tonicas.filter(x => !sel.includes(x));
    if (miss.includes(10)) msgs.push("Recuerda que el endecasílabo siempre lleva acento en la 10.ª sílaba.");
    if (miss.some(x => x !== 10)) msgs.push(`Te falta${miss.filter(x => x !== 10).length > 1 ? "n" : ""} ${miss.filter(x => x !== 10).length} acento${miss.filter(x => x !== 10).length > 1 ? "s" : ""}: busca la sílaba tónica de los sustantivos, adjetivos y verbos.`);
    if (!msgs.length && s.tipo !== q.tipoCorrecto) msgs.push(`Los acentos están bien, pero el tipo no corresponde: con acentos en ${q.tonicas.join(".ª, ")}.ª, revisa la lista de tipos de la lectura.`);
    return msgs.map(P).join("");
  }
  return "";
}
function rerender(id) {
  const el = document.getElementById("q-" + id);
  if (el) el.outerHTML = renderQ(QS[id]);
  renderTabs();
}
function schemeNorm(arr) {
  const map = {}; let next = 0;
  return arr.map(l => { if (!l) return ""; if (!(l in map)) map[l] = "ABCDEF"[next++]; return map[l]; });
}

function check(q) {
  const s = st(q.id); s.msg = "";
  if (q.tipo === "opcion") {
    const c = document.querySelector(`input[name="${q.id}"]:checked`);
    if (!c) { s.msg = "Elige una opción."; return; }
    s.sel = +c.value; s.intentos = (s.intentos || 0) + 1; s.ok = s.sel === q.correcta; s.done = s.ok || s.intentos >= 2;
  } else if (q.tipo === "numero") {
    const v = parseInt(document.getElementById("n-" + q.id).value, 10);
    if (!v) { s.msg = "Escribe un número."; return; }
    s.val = v; s.intentos = (s.intentos || 0) + 1; s.ok = v === q.correcta; s.done = s.ok || s.intentos >= 3;
  } else if (q.tipo === "corta") {
    const w = norm(s.texto || "").split(/[^a-zñ]+/).filter(Boolean);
    if (!w.length) { s.msg = "Escribe tu respuesta."; return; }
    s.intentos = (s.intentos || 0) + 1; s.ok = w.some(x => q.aceptadas.includes(x)); s.done = s.ok || s.intentos >= 3;
  } else if (q.tipo === "acepcion") {
    if (q.opciones) {
      const c = document.querySelector(`input[name="${q.id}"]:checked`);
      if (!c) { s.msg = "Elige una acepción."; return; }
      s.sel = +c.value; s.intentos = (s.intentos || 0) + 1; s.ok = s.sel === q.correcta; s.done = s.ok || s.intentos >= 2;
    } else {
      if ((s.texto || "").trim().length < 5) { s.msg = "Copia la definición."; return; }
      s.intentos = (s.intentos || 0) + 1; s.ok = simil(s.texto, q.acepcion) >= 0.75; s.done = s.ok || s.intentos >= 3;
    }
  } else if (q.tipo === "silabas") {
    if (!(s.b || []).length) { s.msg = "Marca dónde empieza cada sílaba."; return; }
    const sol = solB(q), b = s.b;
    s.intentos = (s.intentos || 0) + 1; s.ok = sol.length === b.length && sol.every(x => b.includes(x)); s.done = s.ok || s.intentos >= 3;
  } else if (q.tipo === "acentos") {
    const sel = s.sel || [];
    if (!sel.length || !s.tipo) { s.msg = "Marca las sílabas acentuadas y elige el tipo."; return; }
    const opt = q.opcionales || [];
    s.intentos = (s.intentos || 0) + 1;
    s.ok = q.tonicas.every(x => sel.includes(x)) && sel.every(x => q.tonicas.includes(x) || opt.includes(x)) && s.tipo === q.tipoCorrecto;
    s.done = s.ok || s.intentos >= 3;
  } else if (q.tipo === "rima") {
    const letras = s.letras || [];
    if (VERSOS.some((_, i) => !letras[i])) { s.msg = "Asigna una letra a los 14 versos."; return; }
    const n = schemeNorm(letras);
    s.res = n.map((l, i) => l === q.correcta[i]);
    s.intentos = (s.intentos || 0) + 1; s.ok = s.res.every(Boolean); s.done = s.ok || s.intentos >= 3;
  }
}
function saveOpen(q) {
  const s = st(q.id); s.msg = "";
  if (q.tipo === "abierta") {
    if ((s.texto || "").trim().length < 20) { s.msg = "Escribe una respuesta más completa antes de guardar."; return; }
  } else if (q.tipo === "diccionario") {
    const it = s.items || {};
    if (q.palabras.some((_, i) => !(it[i] && (it[i].def || "").trim() && (it[i].sen || "").trim()))) { s.msg = "Completa los dos campos de cada palabra."; return; }
  } else if (q.tipo === "acepcion") {
    if ((s.texto || "").trim().length < 10) { s.msg = "Escribe qué significa la palabra en el verso."; return; }
  } else if (q.tipo === "seleccion") {
    if (!Object.keys(s.marcadas || {}).length) { s.msg = "Marca al menos una palabra."; return; }
  } else if (q.tipo === "marcar") {
    const m = s.marcadas || {}, ks = Object.keys(m);
    if (ks.length < q.minimo) { s.msg = `Marca al menos ${q.minimo} palabras.`; return; }
    if (ks.some(k => !(m[k] || "").trim())) { s.msg = "Explica cada palabra que marcaste."; return; }
  }
  s.done = true; s.fecha = new Date().toISOString();
}

/* ---------- partes ---------- */
function renderPart() {
  const el = document.getElementById("part");
  if (S.sec === N_PARTES) { renderEntrega(el); return; }
  const p = UNIDAD.partes[S.sec];
  el.innerHTML = `<div class="part-head"><p class="eyebrow">Parte ${S.sec + 1} de ${N_PARTES}</p><h2>${esc(p.titulo)}</h2><p class="lead">${esc(p.lead)}</p></div>
    ${p.lectura ? `<div class="reading">${p.lectura}</div>` : ""}
    ${p.requiere && !isDone(QS[p.requiere])
      ? `<div class="fb info"><p>Primero decide qué palabras hay que buscar: completa la pregunta ${QS[p.requiere].n} de «${esc(UNIDAD.partes[QS[p.requiere].parte].nombre)}».</p><p><button class="btn ghost" data-act="nav" data-i="${QS[p.requiere].parte}">Ir a esa pregunta</button></p></div>`
      : p.preguntas.map(renderQ).join("")}
    <button class="btn ghost next" data-act="nav" data-i="${S.sec + 1}">${S.sec + 1 < N_PARTES ? "Siguiente: " + esc(UNIDAD.partes[S.sec + 1].nombre) : "Ir a la entrega"} →</button>`;
}

function stats() {
  const all = Object.values(QS), auto = all.filter(q => AUTO.includes(q.tipo));
  return {
    total: all.length, hechas: all.filter(isDone).length,
    auto: auto.length, primera: auto.filter(q => { const s = S.r[q.id]; return s && s.ok && s.intentos === 1; }).length,
    finalOk: auto.filter(q => { const s = S.r[q.id]; return s && s.ok; }).length
  };
}
function buildReport() {
  const t = stats(), L = [];
  L.push(`${UNIDAD.programa} · ${UNIDAD.curso} · ${UNIDAD.bloque}`);
  L.push(`Profesor: ${UNIDAD.profesor}`);
  L.push(`UNIDAD: ${UNIDAD.autor}, «${UNIDAD.titulo}»`);
  L.push(`Texto: ${UNIDAD.referenciaTexto}`);
  L.push(`Alumno: ${S.nombre.trim() || "(sin nombre)"}    Correo: ${(S.correo || "").trim() || "-"}`);
  L.push(`Fecha: ${new Date().toLocaleString("es-MX")}`);
  L.push(`Avance: ${t.hechas}/${t.total} preguntas respondidas`);
  UNIDAD.partes.forEach((p, pi) => {
    L.push("", `=== ${pi + 1}. ${p.nombre.toUpperCase()} ===`);
    p.preguntas.forEach(q => {
      const s = S.r[q.id] || {};
      L.push("", `${q.n}. ${strip(q.enunciado)}`);
      if (!s.done) { L.push("   (sin responder)"); return; }
      if (q.tipo === "opcion") L.push(`   → ${strip(q.opciones[s.sel])}`);
      else if (q.tipo === "silabas") L.push(`   → ${divText(VERSOS[q.verso - 1], new Set(s.b))}`);
      else if (q.tipo === "acentos") L.push(`   → sílabas ${[...s.sel].sort((x, y) => x - y).join(", ")}; ${s.tipo}`);
      else if (q.tipo === "numero") L.push(`   → ${s.val}`);
      else if (q.tipo === "rima") L.push(`   → ${schemeNorm(s.letras).join("")}`);
      else if (q.tipo === "abierta") L.push("   " + (s.texto || "").trim().replace(/\n/g, "\n   "));
      else if (q.tipo === "diccionario") q.palabras.forEach((w, i) => { const v = (s.items || {})[i] || {}; L.push(`   · ${w.forma} (v. ${w.verso})`, `     Autoridades: ${(v.def || "").trim()}`, `     En el verso: ${(v.sen || "").trim()}`); });
      else if (q.tipo === "seleccion") { const r = seleccionRes(q, s.marcadas); L.push(`   Marcó: ${sortKeys(Object.keys(s.marcadas || {})).map(tokWord).join(", ")}`, `   Encontró ${r.found.length} de ${q.terminos.length}. Faltaron: ${r.missed.map(t => t.forma).join(", ") || "ninguna"}`); }
      else if (q.tipo === "corta") L.push(`   → ${(s.texto || "").trim()}`);
      else if (q.tipo === "acepcion") L.push(`   → ${q.opciones ? q.opciones[s.sel] : (s.texto || "").trim()}`);
      else if (q.tipo === "marcar") Object.keys(s.marcadas || {}).sort((a, b) => { const [la, wa] = a.split("-").map(Number), [lb, wb] = b.split("-").map(Number); return la - lb || wa - wb; }).forEach(k => {
        const [l, w] = k.split("-").map(Number); L.push(`   · ${tokens(VERSOS[l - 1])[w].w} (v. ${l}): ${(s.marcadas[k] || "").trim()}`);
      });
    });
  });
  return L.join("\n");
}
function renderReport() { const r = document.getElementById("report"); if (r) r.value = buildReport(); const w = document.getElementById("nameWarn"); if (w) w.hidden = !!S.nombre.trim() && correoValido(S.correo); const st2 = document.getElementById("sendTo"); if (st2) st2.textContent = (S.correo || "").trim() || "tu correo"; }
function renderEntrega(el) {
  const t = stats();
  const rows = UNIDAD.partes.map((p, i) => { const d = p.preguntas.filter(isDone).length, tot = p.preguntas.length;
    return `<tr><td>${i + 1}. ${esc(p.nombre)}</td><td>${d}/${tot}</td><td><span class="pill ${d === tot ? "ok" : "pend"}">${d === tot ? "Completa" : "Pendiente"}</span></td></tr>`; }).join("");
  const envio = ENVIO_URL ? `
    <section class="send" aria-labelledby="sendTitle">
      <h3 id="sendTitle">1. Envía tus respuestas</h3>
      <p>Tu profesor recibirá el registro de tu entrega y tú recibirás una copia de tus respuestas en <strong id="sendTo">${esc((S.correo || "").trim() || "tu correo")}</strong>, para que la guardes como evidencia.</p>
      <div class="row"><button class="btn" data-act="send" id="sendBtn">Enviar mis respuestas</button><span id="sendMsg" role="status">${S.enviado ? "Última entrega: " + esc(new Date(S.enviado).toLocaleString("es-MX")) + "." : ""}</span></div>
    </section>
    <h3 class="steps-title">2. Marca la tarea en Classroom</h3>` : "";
  el.innerHTML = `<div class="part-head"><p class="eyebrow">Último paso</p><h2>Entrega</h2>
      <p class="lead">${ENVIO_URL ? "Cuando termines, envía tus respuestas desde aquí y después marca la tarea como entregada en Classroom." : "Cuando termines, copia tus respuestas y entrégalas en la tarea de Classroom. Así tu profesor sabe que completaste la actividad y puede revisar tus respuestas abiertas."}</p></div>
    <table class="summary"><thead><tr><th>Parte</th><th>Respondidas</th><th>Estado</th></tr></thead><tbody>${rows}</tbody></table>
    <div class="fb bad" id="nameWarn" ${S.nombre.trim() && correoValido(S.correo) ? "hidden" : ""}><p>Escribe tu nombre completo y tu correo en la parte superior antes de entregar.</p></div>
    ${envio}
    <ol class="steps">
      ${ENVIO_URL ? `<li>En Classroom, abre la tarea y pulsa <strong>Entregar</strong> (o <strong>Marcar como completada</strong>).</li>
      <li>Si tu profesor te lo pide, pega también ahí tus respuestas: pulsa <strong>Copiar respuestas</strong>, elige <strong>Añadir o crear → Documentos</strong> y pégalas.</li>`
      : `<li>Pulsa <strong>Copiar respuestas</strong>.</li>
      <li>En Classroom, abre la tarea y elige <strong>Añadir o crear → Documentos</strong>.</li>
      <li>Pega tus respuestas en el documento y vuelve a la tarea.</li>
      <li>Pulsa <strong>Entregar</strong>.</li>`}
    </ol>
    <div class="row"><button class="btn ${ENVIO_URL ? "ghost" : ""}" data-act="copy">Copiar respuestas</button><span id="copyMsg" role="status"></span></div>
    <textarea class="report" id="report" readonly aria-label="Tus respuestas"></textarea>
    <div class="confirm" id="resetBox"><button class="btn ghost" data-act="reset">Borrar mis respuestas y empezar de nuevo</button></div>`;
  renderReport();
}

function render() { renderTabs(); renderPart(); }

/* ---------- eventos ---------- */
document.addEventListener("click", e => {
  const b = e.target.closest("[data-act]"); if (!b) return;
  const act = b.dataset.act, q = QS[b.dataset.q];
  if (act === "nav") { S.sec = Math.min(+b.dataset.i, N_PARTES); save(); render(); document.getElementById("part").scrollIntoView({ block: "start" }); window.scrollTo({ top: 0 }); }
  else if (act === "check") { check(q); save(); rerender(q.id); }
  else if (act === "ideas") {
    const s = st(q.id);
    if ((s.texto || "").trim().length < 20) s.msg = "Escribe una respuesta más completa antes de revisarla.";
    else { s.msg = ""; s.revisado = s.texto; }
    save(); rerender(q.id);
  }
  else if (act === "save") { saveOpen(q); save(); rerender(q.id); }
  else if (act === "ch") {
    const s = st(q.id), v = VERSOS[q.verso - 1]; let i = +b.dataset.i; s.msg = "";
    if (i > 0 && ["rr", "ll", "ch"].includes((v[i - 1] + v[i]).toLowerCase())) i--;
    if (i === firstL(v)) return;
    s.b = s.b || []; const k = s.b.indexOf(i); if (k >= 0) s.b.splice(k, 1); else s.b.push(i);
    save(); rerender(q.id);
  }
  else if (act === "acc") {
    const s = st(q.id), i = +b.dataset.i; s.msg = ""; s.sel = s.sel || [];
    const k = s.sel.indexOf(i); if (k >= 0) s.sel.splice(k, 1); else s.sel.push(i);
    save(); rerender(q.id);
  }
  else if (act === "tok") {
    const s = st(q.id); s.marcadas = s.marcadas || {}; s.msg = "";
    if (b.dataset.k in s.marcadas) delete s.marcadas[b.dataset.k]; else s.marcadas[b.dataset.k] = "";
    save(); rerender(q.id);
  }
  else if (act === "send") {
    const msg = document.getElementById("sendMsg");
    if (!S.nombre.trim() || !correoValido(S.correo)) { msg.textContent = "Escribe tu nombre completo y un correo válido en la parte superior."; nombre.focus(); return; }
    const t = stats();
    b.disabled = true; msg.textContent = "Enviando…";
    fetch(ENVIO_URL, { method: "POST", headers: { "Content-Type": "text/plain;charset=utf-8" },
      body: JSON.stringify({ unidad: UNIDAD.id, titulo: `${UNIDAD.autor}, «${UNIDAD.titulo}»`, curso: `${UNIDAD.curso} · ${UNIDAD.bloque}`, nombre: S.nombre.trim(), correo: S.correo.trim(), avance: `${t.hechas}/${t.total}`, informe: buildReport() }) })
      .then(r => r.json())
      .then(d => {
        if (!d.ok) throw new Error(d.error || "error");
        S.enviado = new Date().toISOString(); save();
        msg.textContent = `Enviado. Revisa tu correo (${S.correo.trim()}); si no lo ves en unos minutos, busca también en la carpeta de spam.`;
      })
      .catch(() => { msg.textContent = "No se pudo enviar. Revisa tu conexión e inténtalo de nuevo; si sigue fallando, copia tus respuestas y entrégalas en Classroom."; })
      .finally(() => { b.disabled = false; });
  }
  else if (act === "copy") {
    const r = document.getElementById("report"), msg = document.getElementById("copyMsg");
    r.value = buildReport();
    const fallback = () => { r.focus(); r.select(); msg.textContent = "Texto seleccionado: cópialo con Ctrl+C (o Cmd+C)."; };
    try { navigator.clipboard.writeText(r.value).then(() => { msg.textContent = "Copiado. Ahora pégalo en el documento de Classroom."; }, fallback); } catch (err) { fallback(); }
  }
  else if (act === "reset") {
    document.getElementById("resetBox").innerHTML = `<span>¿Seguro? Se borrarán todas tus respuestas en este navegador.</span><button class="btn danger" data-act="reset-yes">Sí, borrar</button><button class="btn ghost" data-act="nav" data-i="${N_PARTES}">Cancelar</button>`;
  }
  else if (act === "reset-yes") { S = { nombre: S.nombre, correo: S.correo, r: {}, sec: 0 }; save(); render(); }
});
document.addEventListener("input", e => {
  const t = e.target, id = t.dataset.q; if (!id || t.readOnly) return;
  const s = st(id), f = t.dataset.f;
  if (f === "texto") s.texto = t.value;
  else if (f === "def" || f === "sen") { s.items = s.items || {}; (s.items[t.dataset.i] = s.items[t.dataset.i] || {})[f] = t.value; }
  else if (f === "nota") { s.marcadas[t.dataset.k] = t.value; }
  save();
});
document.addEventListener("change", e => {
  const t = e.target;
  if (t.dataset.tipo) { st(t.dataset.tipo).tipo = t.value; save(); }
  if (t.dataset.rima) { const s = st(t.dataset.rima); s.letras = s.letras || []; s.letras[+t.dataset.i] = t.value; save(); }
});

render();
</script>
